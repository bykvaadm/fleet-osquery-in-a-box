# Agent stack for the Fleet osquery-in-a-box lab.
#
# Every service builds the parameterized agent image in ../agent (osquery 5.23.0)
# for a specific Ubuntu base. An `image:` name is also set so the same file works
# whether you build locally or pull from ghcr: `docker compose` builds the image
# if it is not already present locally, otherwise it uses/pulls the named image.
#
# Requires the external `fleet-preview` network created by the server stack
# (../docker-compose.yml) and an ENROLL_SECRET in the environment.
#
# (The obsolete top-level `version:` key has been removed — modern Compose.)

networks:
  fleet-preview:
    name: fleet-preview
    external: true

# Shared bits reused by every agent service (YAML anchors).
x-agent-common: &agent-common
  volumes:
    - ./fleet.crt:/etc/osquery/fleet.crt:ro
  environment:
    ENROLL_SECRET: "${ENROLL_SECRET:?ENROLL_SECRET must be set for server authentication}"
    FLEET_SERVER: "${FLEET_SERVER:-host.docker.internal:8412}"
  ulimits:
    core:
      hard: 1000000000
      soft: 1000000000
  networks:
    - fleet-preview

services:
  ubuntu2004-agent:
    <<: *agent-common
    image: ghcr.io/bykvaadm/fleet-osquery-agent:5.23.0-ubuntu20.04
    build:
      context: ../agent
      args:
        UBUNTU_VERSION: "20.04"

  ubuntu2204-agent:
    <<: *agent-common
    image: ghcr.io/bykvaadm/fleet-osquery-agent:5.23.0-ubuntu22.04
    build:
      context: ../agent
      args:
        UBUNTU_VERSION: "22.04"

  ubuntu2404-agent:
    <<: *agent-common
    image: ghcr.io/bykvaadm/fleet-osquery-agent:5.23.0-ubuntu24.04
    build:
      context: ../agent
      args:
        UBUNTU_VERSION: "24.04"

  ubuntu2604-agent:
    <<: *agent-common
    image: ghcr.io/bykvaadm/fleet-osquery-agent:5.23.0-ubuntu26.04
    build:
      context: ../agent
      args:
        UBUNTU_VERSION: "26.04"

  # Deliberately-vulnerable demo host targeted by the lab scenarios. The
  # seed-vulnerabilities.sh script (authored separately) is baked/mounted into
  # the agent image; the entrypoint runs it when SEED_VULNS is truthy.
  vuln-agent:
    <<: *agent-common
    image: ghcr.io/bykvaadm/fleet-osquery-agent:5.23.0-ubuntu24.04
    build:
      context: ../agent
      args:
        UBUNTU_VERSION: "24.04"
    environment:
      ENROLL_SECRET: "${ENROLL_SECRET:?ENROLL_SECRET must be set for server authentication}"
      FLEET_SERVER: "${FLEET_SERVER:-host.docker.internal:8412}"
      SEED_VULNS: "true"
