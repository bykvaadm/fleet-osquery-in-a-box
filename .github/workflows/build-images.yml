name: Build osquery agent images

# Builds the multi-arch osquery agent images and pushes them to Docker Hub
# (docker.io/bykva/osquery).
#
# Triggers:
#   - push to the `production` release branch
#   - version tags (e.g. v5.23.0)
#   - manual run from the Actions tab
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  - the Docker Hub account (e.g. bykva)
#   DOCKERHUB_TOKEN     - a Docker Hub access token with write scope
on:
  push:
    branches:
      - production
    tags:
      - "v*"
  workflow_dispatch:

# The image repo on Docker Hub. Change this if you fork to a different account.
env:
  IMAGE: docker.io/bykva/osquery
  OSQUERY_VERSION: "5.23.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Keep building the other bases even if one Ubuntu version fails.
      fail-fast: false
      matrix:
        ubuntu_version: ["20.04", "22.04", "24.04", "26.04"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets us build arm64 alongside amd64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The single Docker Hub repo (bykva/osquery) holds every Ubuntu variant as
      # a distinct tag: a pinned :<osquery>-ubuntu<ver> and a moving :ubuntu<ver>.
      - name: Compute tags
        id: tags
        run: |
          ver="${{ matrix.ubuntu_version }}"
          echo "pinned=${IMAGE}:${OSQUERY_VERSION}-ubuntu${ver}" >> "$GITHUB_OUTPUT"
          echo "moving=${IMAGE}:ubuntu${ver}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            OSQUERY_VERSION=${{ env.OSQUERY_VERSION }}
          tags: |
            ${{ steps.tags.outputs.pinned }}
            ${{ steps.tags.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
