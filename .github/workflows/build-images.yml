name: Build osquery agent images

# Builds the multi-arch osquery agent images and pushes them to GHCR.
#
# Triggers:
#   - push to the `production` release branch
#   - version tags (e.g. v5.23.0)
#   - manual run from the Actions tab
#
# NOTE: this workflow is committed but the repo owner must enable GitHub
# Actions + package write perms for it to actually push. The GITHUB_TOKEN used
# below is provided automatically per-run and needs the `packages: write` scope
# declared in `permissions` (below).
on:
  push:
    branches:
      - production
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Keep building the other bases even if one Ubuntu version fails.
      fail-fast: false
      matrix:
        ubuntu_version: ["20.04", "22.04", "24.04", "26.04"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets us build arm64 alongside amd64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive a bare "2404"-style suffix used in the moving :ubuntu<ver> tag.
      - name: Compute tags
        id: tags
        run: |
          ver="${{ matrix.ubuntu_version }}"
          echo "pinned=ghcr.io/${{ github.repository_owner }}/fleet-osquery-agent:5.23.0-ubuntu${ver}" >> "$GITHUB_OUTPUT"
          echo "moving=ghcr.io/${{ github.repository_owner }}/fleet-osquery-agent:ubuntu${ver}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            OSQUERY_VERSION=5.23.0
          tags: |
            ${{ steps.tags.outputs.pinned }}
            ${{ steps.tags.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
